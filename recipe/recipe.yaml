schema_version: 1

context:
  name: librttopo
  version: "1.1.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: http://www.gaia-gis.it/gaia-sins/${{ name }}-${{ version }}.tar.gz
  sha256: 5b4002b2b6be1fe59a487cff6edbc81db773dd1e437beb966fac6ac68e849f19
  patches:
    - if: win
      then:
        - 0001-fix_msvc_paths.patch
        - 0002-fix_msvc_nan.patch
    # Backport of PostGIS ca3323d8c7 (postgis/postgis#1160): GEOS >= 3.15
    # line-merges overlay output, hiding junctions that must become nodes
    - 0003-preserve-overlay-junctions-geos-3.15.patch

build:
  number: 23

requirements:
  build:
    - if: unix
      then:
        - gnuconfig
        - make
    - ${{ compiler('c') }}
    - ${{ stdlib('c') }}
    - ${{ compiler('cxx') }}
  host:
    - geos
  run:
    - geos
  run_exports:
    # No idea.  Staying with minor version pin.
    - ${{ pin_subpackage('librttopo', upper_bound='x.x') }}

tests:
  - script:
      - python run_test.py
    requirements:
      run:
        - python
    files:
      recipe:
        - run_test.py
  - if: win
    then:
      script:
        - call test-point.bat
      requirements:
        build:
          - ${{ compiler('c') }}
      files:
        recipe:
          - test-point.c
          - test-point.bat

about:
  homepage: https://git.osgeo.org/gitea/rttopo/librttopo
  license: GPL-2.0-or-later
  license_file: COPYING
  summary: |
    The RT Topology Library exposes an API to create and manage standard
    topologies using user-provided data stores.
  description: |
    The RT Topology Library exposes an API to create and manage standard (ISO
    13249 aka SQL/MM) topologies using user-provided data stores and released
    under the GNU GPL license (version 2 or later).

    The code is derived from PostGIS liblwgeom library enhanced to provide
    thread-safety, have less dependencies and be independent from PostGIS
    release cycles.

    The RT Topology Library was funded by “Regione Toscana - SITA” (CIG:
    6445512CC1), which also funded many improvements in the originating
    liblwgeom.
  documentation: https://git.osgeo.org/gitea/rttopo/librttopo
  repository: https://git.osgeo.org/gitea/rttopo/librttopo

extra:
  recipe-maintainers:
    - xylar
